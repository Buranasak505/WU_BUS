<div class="min-h-[80vh] flex items-center justify-center px-4">
  <div class="bg-white max-w-md w-full rounded-[2rem] shadow-2xl overflow-hidden border border-gray-100">
    
    <!-- ส่วนหัว -->
    <div class="bg-gray-900 p-8 text-center relative overflow-hidden">
      <div class="absolute -right-10 -top-10 w-32 h-32 bg-blue-500/20 rounded-full blur-2xl"></div>
      <div class="relative z-10">
        <div class="w-16 h-16 bg-blue-500 text-white rounded-2xl flex items-center justify-center text-3xl mx-auto shadow-lg mb-4">🔒</div>
        <h2 class="text-2xl font-extrabold text-white">สำหรับผู้ดูแลระบบ</h2>
        <p class="text-gray-400 text-sm mt-1">เข้าสู่ระบบเพื่อจัดการข้อมูลสายรถ</p>
      </div>
    </div>

    <!-- ฟอร์ม -->
    <div class="p-8">
      <form (ngSubmit)="onSubmit()" class="space-y-6">
        <div *ngIf="errorMessage" class="bg-red-50 text-red-600 px-4 py-3 rounded-xl text-sm font-bold border border-red-100 flex items-center gap-2">
          <span>⚠️</span> {{ errorMessage }}
        </div>

        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2">ชื่อผู้ใช้ (Username)</label>
          <input type="text" [(ngModel)]="username" name="username" 
                 class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all font-medium"
                 placeholder="พิมพ์ชื่อผู้ใช้ของคุณ">
        </div>

        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2">รหัสผ่าน (Password)</label>
          <input type="password" [(ngModel)]="password" name="password" 
                 class="w-full px-5 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all font-medium"
                 placeholder="••••••••">
        </div>

        <button type="submit" [disabled]="isLoading" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-200 transition-all flex justify-center items-center gap-2">
          {{ isLoading ? 'กำลังตรวจสอบ...' : 'เข้าสู่ระบบ ➔' }}
        </button>
      </form>
      <div class="mt-6 text-center">
        <a routerLink="/" class="text-sm font-bold text-gray-500 hover:text-gray-800 transition-colors">กลับไปหน้าหลัก</a>
      </div>
    </div>
    
  </div>
</div>
